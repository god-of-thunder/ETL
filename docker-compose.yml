
services:

  db:
    image: postgres:15
    container_name: ecommerce_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
    - postgres_data:/var/lib/postgresql/data  

  backend:
    build: ./backend
    container_name: ecommerce_backend
    volumes:
      - ./backend:/app
    command: >
      sh -c "sleep 10 &&
             uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    depends_on:
      - db


  airflow:
    image: apache/airflow:2.9.1

    container_name: airflow

    ports:
      - "8080:8080"

    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@db:5432/ecommerce

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    volumes:
      - ./airflow/dags:/opt/airflow/dags

    command: >
      bash -c "
      airflow db migrate &&
      airflow users create \
        --username admin \
        --password admin \
        --firstname admin \
        --lastname admin \
        --role Admin \
        --email admin@test.com || true &&
      airflow standalone
      "

    depends_on:
      - db    

  spark-master:
    image: apache/spark:3.5.1

    container_name: spark-master

    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master

    ports:
      - "8081:8080"
      - "7077:7077"

  spark-worker:
    image: apache/spark:3.5.1

    container_name: spark-worker

    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077

    depends_on:
      - spark-master

  jupyter:
    build: ./jupyter

    container_name: pyspark-dev

    ports:
      - "8888:8888"

    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - PYSPARK_PYTHON=/usr/bin/python3.8
      - PYSPARK_DRIVER_PYTHON=/usr/bin/python3.8

    volumes:
      - ./notebooks:/home/jovyan/work

    depends_on:
      - spark-master 

  metabase:
    image: metabase/metabase:latest

    container_name: metabase

    ports:
      - "3000:3000"

    depends_on:
      - db       

volumes:
  postgres_data:
